baseURL: http://localhost:1313/
title: Research Methodology Hub
defaultContentLanguage: en
theme: hextra

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - - $$
              - $$
            - - \[
              - \]
          inline:
            - - \(
              - \)
  highlight:
    noClasses: false

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Search
      params:
        type: search
      weight: 2
    - name: GitHub
      url: https://github.com/
      params:
        icon: github
      weight: 3

params:
  description: A polished demo documentation portal for computer science, AI, and big data research methodology.
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: images/logo.svg
      dark: images/logo-dark.svg
      width: 28
      height: 28
  search:
    enable: true
    type: flexsearch
    flexsearch:
      js: js/flexsearch.bundle.min.js
  mermaid:
    js: js/mermaid.min.js
  math:
    engine: katex
    katex:
      css: css/katex.min.css
  page:
    width: wide
    displayUpdatedDate: false
    displayPagination: true
    tabs:
      sync: true
  theme:
    default: system
    displayToggle: true
